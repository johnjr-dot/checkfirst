<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>CheckFirst publisher</title>
<script>try{var t=localStorage.getItem('theme');if(!t&&matchMedia('(prefers-color-scheme: dark)').matches)t='dark';if(t==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}</script>
<link rel="stylesheet" href="style.css">
<style>
  main{max-width:820px;margin:0 auto;padding:24px 20px 60px}
  label{display:block;font-weight:600;margin:14px 0 4px}
  input,textarea,select{width:100%;font:inherit;padding:10px;border:2px solid var(--line);border-radius:8px;background:var(--card);color:var(--text)}
  textarea{resize:vertical}
  #raw.drag{border-color:var(--lens);background:#e3f1f0}
  html[data-theme="dark"] #raw.drag{background:#12323a}
  .warn,.okmsg{padding:8px 12px;margin:6px 0;border-radius:6px}
  .warn{background:#fff3cd;border-left:6px solid var(--mark)}
  .okmsg{background:#dcefe3;border-left:6px solid var(--real)}
  html[data-theme="dark"] .warn{background:#3a3410}
  html[data-theme="dark"] .okmsg{background:#12372a}
  .gates label{font-weight:400;display:flex;gap:10px;align-items:flex-start;margin:8px 0}
  .gates input{width:auto;margin-top:5px}
  .row{display:grid;gap:12px}
  @media(min-width:640px){.row{grid-template-columns:1fr 1fr 1fr}}
  button:disabled{opacity:.45;cursor:not-allowed}
  #json{font-family:"Courier New",monospace;font-size:.85rem}
</style>
</head>
<body>
<nav class="top"><a class="logo" href="./">Check<span>First</span></a><span style="color:#fff;font-weight:600">Publisher</span></nav>
<main>
  <h1>Publish an article</h1>
  <p class="lead">Paste the article exactly as it arrives, or drop a text file onto the box. It sorts out the title, author, sources and body for you. Nothing leaves your browser.</p>

  <label for="raw">Paste here</label>
  <textarea id="raw" rows="10" placeholder="Paste the form response or email here, or drag and drop a .txt file onto this box"></textarea>
  <div class="actions"><button id="parse" class="btn" type="button">Arrange it</button><button id="clear" class="btn ghost" type="button">Clear</button></div>

  <section id="review" hidden style="padding:30px 0 0;margin:0;max-width:none">
    <h2>Check and edit</h2>
    <div class="row">
      <div><label for="date">Date</label><input id="date" type="date"></div>
      <div><label for="author">Author name (shown on site)</label><input id="author" type="text"></div>
      <div><label for="lang">Article language</label><select id="lang"><option value="en">English</option><option value="sw">Kiswahili</option></select></div>
    </div>
    <label for="title">Title</label><input id="title" type="text">
    <label for="summary">Short summary (1 to 2 sentences, shown on the card)</label><textarea id="summary" rows="3"></textarea>
    <label for="body">Article (leave a blank line between paragraphs)</label><textarea id="body" rows="14"></textarea>
    <label for="sources">Sources (one per line)</label><textarea id="sources" rows="4"></textarea>
    <p><a id="reply" href="#" hidden></a></p>

    <h3>Automatic checks</h3>
    <div id="warnings" aria-live="polite"></div>

    <h3>Your checks</h3>
    <div class="gates">
      <label><input class="gate" type="checkbox"> I checked the facts against sources I trust.</label>
      <label><input class="gate" type="checkbox"> No private individuals or small businesses are named as scammers.</label>
      <label><input class="gate" type="checkbox"> I removed links, phone numbers and account details.</label>
      <label><input class="gate" type="checkbox"> I have replied, or will reply, to the author.</label>
    </div>

    <h3>Preview</h3>
    <div id="preview"></div>

    <h3>Publish</h3>
    <div class="actions">
      <button id="copyFull" class="btn" type="button" disabled>Copy whole articles.json</button>
      <button id="dlFull" class="btn ghost" type="button" disabled>Download articles.json</button>
      <button id="copyEntry" class="btn ghost" type="button" disabled>Copy only this article</button>
      <a id="gh" class="btn ghost" href="#" target="_blank" rel="noopener noreferrer">Open articles.json on GitHub</a>
    </div>
    <p id="status" role="status" class="lead"></p>
    <label for="json">This article as data</label>
    <textarea id="json" rows="8" readonly></textarea>
  </section>
</main>
<script src="publish.js"></script>
</body>
</html>
